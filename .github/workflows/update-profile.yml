name: Update profile

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.json
      - scripts/update_profile.py
      - '**/avatar.txt'
      - assets/avatar-tones.json
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh public profile data
        env:
          PROFILE_BIRTH_DATE: ${{ secrets.PROFILE_BIRTH_DATE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile.py --refresh

      - name: Commit generated files
        id: commit
        shell: bash
        run: |
          git add -- README.md assets/neofetch.svg assets/neofetch-mobile.svg assets/stats.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update public profile card'
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Push generated files
        if: steps.commit.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git -c credential.helper= \
            -c 'credential.helper=!f() { printf "%s\n" "username=x-access-token" "password=$GITHUB_TOKEN"; }; f' \
            push origin "HEAD:${GITHUB_REF_NAME}"
